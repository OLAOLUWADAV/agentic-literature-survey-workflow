version: '3.8'

services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: literature_survey_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_secure_password_replace_in_production_123!}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_survey_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_prod} -d ${POSTGRES_DB:-n8n_survey_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - survey_network

  # ==============================================================================
  # 2. n8n Workflow Automation Engine
  # ==============================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: literature_survey_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_survey_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_prod}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_secure_password_replace_in_production_123!}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://${DOMAIN_NAME:-localhost}}
      - N8N_HOST=${DOMAIN_NAME:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # LLM & Service API keys passed directly to node expressions
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
      - AIRTABLE_TABLE_NAME=${AIRTABLE_TABLE_NAME}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - survey_network

  # ==============================================================================
  # 3. Caddy Reverse Proxy & Automatic SSL
  # ==============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: literature_survey_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
    networks:
      - survey_network

  # ==============================================================================
  # 4. Automated Workflow Importer & Activator
  # ==============================================================================
  n8n-init:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: literature_survey_init
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Waiting for n8n service to be ready...';
        sleep 10;
        echo 'Importing production workflows...';
        n8n import:workflow --input=/workflows/Agentic_Literature_Survey_Workflow.prod.json || true;
        echo 'Workflow auto-import completed successfully!';
      "
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n_survey_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n_prod}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_secure_password_replace_in_production_123!}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    depends_on:
      n8n:
        condition: service_started
    networks:
      - survey_network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  survey_network:
    driver: bridge
